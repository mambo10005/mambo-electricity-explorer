[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mambo-electricity-explorer"
version = "0.1.0"
description = "Local-first, novice-oriented U.S. electricity learning and analysis platform."
readme = "README.md"
requires-python = ">=3.11"
# License intentionally unset — see docs/decisions/0001-license.md.
# Versions and license review: docs/decisions/0002-application-stack.md.
dependencies = [
    "streamlit>=1.65,<2",
    "pyyaml>=6.0.3,<7",
    "duckdb>=1.5.6,<2",
    "pyarrow>=25.0.1,<26",
]
classifiers = [
    "Private :: Do Not Upload",
]

[project.scripts]
mambo = "mambo_explorer.cli:main"

# Dev tools are a PEP 735 dependency group: locked in uv.lock, never published
# as package metadata. See docs/decisions/0003-dependency-locking.md.
[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff==0.17.0",
]

[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.hatch.build.targets.wheel]
packages = ["src/mambo_explorer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
