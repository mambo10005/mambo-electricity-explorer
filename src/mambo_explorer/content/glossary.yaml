# Glossary for beginner lessons. Every lesson's glossary_terms must exist here.
# Agent-drafted 2026-10-11; not human-reviewed (same status as the lessons).
terms:
  - term: MW
    expansion: megawatt
    definition: >-
      A unit of power: how fast electricity is being produced or used at a moment.
      1 MW = 1,000 kilowatts.
  - term: MWh
    expansion: megawatt-hour
    definition: >-
      A unit of energy: an amount of electricity. One MWh is what 1 MW delivers
      over one hour.
  - term: Power
    definition: The rate of producing or using electricity, measured in MW.
  - term: Energy
    definition: >-
      An amount of electricity over a period of time, measured in MWh. Energy =
      average power × duration.
  - term: Demand
    definition: >-
      In EIA-930, the hourly total actual demand that a balancing authority reports
      for its area (data type "D"). It excludes electricity known to be used to
      store energy. It is a system-level total, not a reading of individual
      customer meters.
  - term: Day-ahead demand forecast
    expansion: data type "DF"
    definition: >-
      The balancing authority's own forecast of hourly demand, prepared the day
      before and reported to EIA. This application does not make forecasts.
  - term: BA
    expansion: balancing authority
    definition: >-
      The organization that balances electricity supply and demand in real time
      within an area of the grid and reports EIA-930 data.
  - term: ERCOT
    expansion: Electric Reliability Council of Texas
    definition: >-
      The grid operator for most of Texas. Its EIA-930 respondent code is "ERCO".
  - term: EIA
    expansion: U.S. Energy Information Administration
    definition: The federal statistical agency that publishes the EIA-930 data used here.
  - term: EIA-930
    expansion: Form EIA-930, Hourly and Daily Balancing Authority Operations Report
    definition: >-
      The EIA survey through which balancing authorities report hourly demand,
      forecasts, generation, and interchange.
  - term: UTC
    expansion: Coordinated Universal Time
    definition: >-
      The time standard used for the source's period labels. It does not shift
      for daylight saving time.
  - term: Period label
    definition: >-
      The text the source attaches to each hourly value, such as 2026-10-04T05.
      This app compares and counts labels exactly as given. It does not convert
      them into interval start and end times, because the API does not state that
      convention.
  - term: Absent row
    definition: >-
      No record exists for a label in the collected data. It is not the same as
      a reported value of zero, and it does not by itself tell you why.
  - term: Null value
    definition: A record exists, but its value field is empty.
  - term: Forecast error
    definition: >-
      error = actual − forecast. Positive means demand came in above the forecast;
      negative means below.
  - term: MAE
    expansion: mean absolute error
    definition: The average size of the errors, ignoring their sign. Same unit as the data.
  - term: RMSE
    expansion: root mean square error
    definition: >-
      The square root of the average squared error. Large misses count more
      than in MAE. Same unit as the data.
  - term: Mean error
    definition: >-
      The average error with its sign kept. Positive and negative errors can
      cancel, so it shows bias, not size.
  - term: Revision
    definition: >-
      A later published value for the same series and period. This app keeps
      every revision and uses the latest one.
  # Market-mechanics lessons (Stage 8). Same status: agent-drafted, not human-reviewed.
  - term: Synthetic
    definition: >-
      Made up for teaching. A synthetic network or offer is not taken from any
      real grid, generator, or market.
  - term: Modeled
    definition: >-
      Computed by a model from stated inputs, not measured. Modeled values are
      never presented as observations.
  - term: Dispatch
    definition: >-
      How much each generator produces (in MW) during an interval.
  - term: Power flow
    definition: >-
      A calculation of how power travels over the lines for a dispatch that is
      given to it. It chooses nothing and enforces no limit; it reports flows,
      including any above a line's rating.
  - term: Optimal power flow
    definition: >-
      A calculation that chooses the dispatch: the lowest-cost one that meets
      demand within every generator capacity and line rating in the model.
  - term: Offer
    definition: >-
      In these lessons, a generator's synthetic cost per MWh of output (an
      input you can change), not a real market bid.
  - term: Line rating
    definition: >-
      The most power a line may carry in the model, in MW (the DC model uses
      the MVA rating as a MW limit).
  - term: Reference bus
    definition: >-
      The bus whose voltage angle is fixed at zero. In these lessons its
      generator covers whatever the rest of the dispatch leaves.
  - term: Cost rate
    definition: >-
      Σ offer × output, in synthetic $ per hour. Over a one-hour interval the
      cost in $ has the same number, only because the interval is one hour.
  - term: Binding constraint
    definition: >-
      A limit that the chosen dispatch sits exactly at, so relaxing it would
      change the least-cost dispatch.
  - term: Congestion
    definition: >-
      A situation where a line limit binds, so cheaper power cannot reach where
      it is needed and dearer generation is used instead.
  - term: Marginal cost
    definition: >-
      The change in total cost for one more unit, here one more MW of demand at
      a bus over the interval.
  - term: Modeled nodal price
    definition: >-
      In these lessons, the verified marginal cost of serving one more MW at a
      bus under this lossless teaching model, in synthetic $ per MWh. Not an
      actual ISO price.
  - term: Line-limit sensitivity
    definition: >-
      The change in cost rate per extra MW of a line's rating, in synthetic $
      per hour per MW. Zero unless the limit binds.
  - term: Average change rate
    definition: >-
      The change in cost rate for a finite change of demand, divided by that
      change: [C(D + h) − C(D)] / h for an increase, [C(D) − C(D − h)] / h for a
      decrease, in synthetic $ per MWh. An average over the change, not a local
      marginal rate; it blends two rates if a limit is reached inside the change.
  - term: Breakpoint
    definition: >-
      An operating point where a capacity or line limit is just reached, so
      the cost changes at one rate below it and another above it.
  # Settlement lesson (Stage 11). Same status: agent-drafted, not human-reviewed.
  - term: Day-ahead schedule
    definition: >-
      In this app, the energy (MWh) committed day-ahead for an interval at the
      day-ahead price. A financial commitment, not a forecast and not a
      physical delivery path.
  - term: Deviation
    definition: >-
      Actual energy minus scheduled energy, in MWh. Positive when more energy
      was produced or used than scheduled; negative when less.
  - term: Two-settlement system
    definition: >-
      A market design (ISO New England calls its version multi-settlement) in
      which day-ahead commitments are settled first and the differences from
      them are settled separately at real-time prices.
  - term: Energy settlement
    definition: >-
      In this app's teaching formula, scheduled energy × day-ahead price plus
      deviation × real-time price: one signed amount that a buyer pays and a
      seller receives. Not a complete bill.
  - term: Price exposure
    definition: >-
      How much a settlement amount changes when a price changes. In the
      teaching formula, the total moves by the deviation (MWh) per unit change
      of the real-time price.
  - term: Volume exposure
    definition: >-
      How much a settlement amount changes when the quantity changes. In the
      teaching formula, one more MWh of actual energy changes the total by the
      real-time price.
  # Basis lesson (Stage 12). Same status: agent-drafted, not human-reviewed.
  - term: Basis
    definition: >-
      The price difference between otherwise identical products in different
      markets (FERC glossary). In this app, basis = delivery-location price
      minus hedge-reference price, in synthetic $ per MWh.
  - term: Fixed-for-floating hedge
    definition: >-
      In this app's teaching scenario, a financial agreement in which the buyer
      pays a fixed price K and receives a changing reference price on a hedge
      quantity. It moves money, not electricity.
  - term: Reference location
    definition: >-
      The location whose price a financial hedge settles against. It can differ
      from the location where the energy is actually bought.
  - term: Quantity mismatch
    definition: >-
      The difference between the energy actually bought and the hedge quantity.
      Any mismatch stays exposed to the reference price.
  # Shape lesson (Stage 13). Same status: agent-drafted, not human-reviewed.
  - term: Flat-block hedge
    definition: >-
      In this app's teaching scenario, a financial hedge with the same power
      (MW) in every interval. Its energy in an interval is that power times the
      interval's duration. It moves money, not electricity.
  - term: Load shape
    definition: >-
      How a buyer's energy use is spread across the intervals of a period, for
      example more in the afternoon than in the morning.
  - term: Time-shape component
    definition: >-
      In this app's accounting split, the sum over intervals of the hedge
      mismatch (MWh) times the interval price's difference from the
      duration-weighted average price. Not a standard industry risk metric.
