  # --- reliability ------------------------------------------------------------------------
  - id: ferc-reliability-oversight
    authority_id: ferc
    organization_type: federal-regulator
    activity: reliability
    status: binding-requirement
    jurisdiction_scope: United States bulk-power system, other than Alaska and Hawaii
    supported_responsibility: >-
      FERC certifies an electric reliability organization, may approve the reliability
      standards it proposes, and reviews penalties it imposes. Users, owners, and operators
      of the bulk-power system must comply with approved reliability standards.
    explicit_limitations:
      - The section gives no authority to order construction of generation or transmission.
      - It does not apply in Alaska or Hawaii.
      - Which entities a given standard covers is set by that standard (see 18 CFR 40.1).
    source_reference: fpa-215
    source_section: 16 U.S.C. 824o(b)(1), (c), (d)(2), (e), (i)(2), (k)
    source_version: United States Code, 2023 edition
    published_date: null
    effective_date: null
    retrieved_at: 2026-10-11
    human_review_status: unreviewed
  - id: standards-name-their-subset
    authority_id: ferc
    organization_type: federal-regulator
    activity: reliability
    status: binding-requirement
    jurisdiction_scope: United States bulk-power system, other than Alaska and Hawaii
    supported_responsibility: >-
      FERC's reliability regulations apply to users, owners, and operators of the
      bulk-power system, and each reliability standard must identify the subset of them it
      applies to.
    explicit_limitations:
