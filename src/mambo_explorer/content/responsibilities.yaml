# Regulatory responsibility records (Stage 14, ADR 0012). Educational and versioned.
#
# Each record maps ONE paraphrased claim to ONE official source section. Records say which
# source is relevant to investigate for an activity. They never decide whether a rule
# applies to anyone. Validated by responsibilities.py on every load and in tests.
#
# Dates: published_date and effective_date are null unless the source itself states them.
# retrieved_at is when this project read the source; it is never an effective date. A
# non-null effective_date needs effective_date_basis quoting where the date came from.
# A proposed change never has an effective date.
#
# Agent-drafted 2026-10-11 from the sources below; NOT reviewed by a person.
set_version: 1.0.0
retrieved_at: 2026-10-11

statuses:
  - key: binding-requirement
    label: Binding requirement (statute, regulation, or final rule)
  - key: approved-tariff-or-rule
    label: Approved tariff or market rule
  - key: official-guidance
    label: Official guidance or description (not itself a binding rule)
  - key: educational-summary
    label: Educational summary written for this app
  - key: proposed-change
    label: Proposed change (not effective)

activities:
  - key: wholesale-transactions
    title: Wholesale transactions
    description: Sales of electricity for resale, and the markets where they happen.
  - key: retail-service
    title: Retail service
    description: Selling or delivering electricity to end-use customers.
  - key: reliability
    title: Reliability
    description: Standards for planning and operating the bulk-power system.
  - key: emergency-reporting
    title: Emergency reporting
    description: Reporting electric emergencies, incidents, and disturbances.
  - key: procurement
    title: Procurement
    description: Obtaining enough capacity or energy to serve customers.
  - key: financial-derivatives
    title: Financial derivatives
    description: Futures, swaps, and similar financial contracts linked to electricity.

