# Unresolved conflicts and version uncertainty. Shown in the explorer; never resolved by code.
open_questions:
  - id: ercot-federal-roles
    activities: [wholesale-transactions, reliability]
    text: >-
      ERCOT's page names the Public Utility Commission of Texas and the Texas Legislature as
      its overseers and does not mention FERC or NERC. FPA section 215 excludes only Alaska
      and Hawaii. How federal wholesale and reliability provisions apply in ERCOT was not
      established from the sources retrieved here.
  - id: cip-003-11-dates
    activities: [reliability]
    text: >-
      Order No. 918 took effect on 2026-05-26, but the standard's own enforceable date
      follows an implementation plan that was not read. The two dates may differ.
  - id: doe-417-version
    activities: [emergency-reporting]
    text: >-
      The 2023 notice proposed changes to Form DOE-417. The current form version, who must
      file, and whether filing is mandatory were not verified.
  - id: cftc-ferc-boundary
    activities: [financial-derivatives, wholesale-transactions]
    text: >-
      Both the CFTC's swap and futures jurisdiction and the FERC/state savings clause can
      bear on electricity-linked contracts. Which governs a specific product depends on its
      terms and the venue, and is not decided here.

# Official sources that could not be read on 2026-10-11. Content was narrowed instead.
source_gaps:
  - source: ferc.gov
    outcome: Access error (HTTP 403); statutes and Federal Register documents were used instead.
  - source: nerc.com
    outcome: No readable content; the ERO is described only from the statute and Federal Register.
  - source: texasre.org (Texas Reliability Entity)
    outcome: Missing pages or no readable content; no regional entity is described individually.
  - source: cftc.gov
    outcome: Human-verification page; not bypassed. The statute was used instead.
  - source: DOE Form OE-417 pages (energy.gov, oe.netl.doe.gov)
    outcome: Missing page and DNS failure; only the 2023 Federal Register notice was used.
  - source: puc.texas.gov (Public Utility Commission of Texas)
    outcome: HTTP 402 error; the PUCT appears only through ERCOT's own description.
  - source: federalregister.gov document pages
    outcome: Redirected to a human-verification page; not followed. GovInfo copies and the Federal Register API were used.
