  # --- emergency reporting ----------------------------------------------------------------
  - id: doe-417-collection
    authority_id: doe
    organization_type: federal-department
    activity: emergency-reporting
    status: proposed-change
    jurisdiction_scope: The 50 states, D.C., Puerto Rico, the U.S. Virgin Islands, and other U.S. territories (per the notice)
    supported_responsibility: >-
      DOE uses Form DOE-417 (Electric Emergency Incident and Disturbance Report) to monitor
      electric emergency incidents and disturbances and to support post-incident reviews.
      In 2023 it asked for comments on a three-year extension with changes, including
      changes it said keep the form aligned with NERC standards CIP-008-6 and EOP-004-6.
    explicit_limitations:
      - The notice proposed changes; whether and when they took effect was not verified.
      - It does not list who must file, and it does not say whether filing is mandatory; neither was determined here.
      - DOE's current form and instructions pages were unreachable (missing page or DNS failure).
    source_reference: fr-2023-18729
    source_section: Summary and supplementary information (OMB control number 1901-0288)
    source_version: Federal Register document 2023-18729
    published_date: 2023-08-30
    effective_date: null
    retrieved_at: 2026-10-11
    human_review_status: unreviewed

