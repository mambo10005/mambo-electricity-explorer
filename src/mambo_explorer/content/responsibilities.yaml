records:
  # --- wholesale transactions -------------------------------------------------------------
  - id: ferc-wholesale-sales
    authority_id: ferc
    organization_type: federal-regulator
    activity: wholesale-transactions
    status: binding-requirement
    jurisdiction_scope: United States; federal law (Part II of the Federal Power Act)
    supported_responsibility: >-
      This part of the Federal Power Act covers the transmission of electric energy in
      interstate commerce and the sale of electric energy at wholesale in interstate
      commerce. It defines a wholesale sale as a sale to any person for resale.
    explicit_limitations:
      - The section does not, by itself, settle whether a particular sale is in interstate commerce.
      - How these provisions apply inside ERCOT was not established from the sources retrieved here.
      - ferc.gov returned an access error, so FERC's own explanations were not read.
    source_reference: fpa-201
    source_section: 16 U.S.C. 824(b)(1) and (d)
    source_version: United States Code, 2023 edition (latest amendment cited there, Pub. L. 114-94, 2015)
    published_date: null
    effective_date: null
    retrieved_at: 2026-10-11
    human_review_status: unreviewed
  - id: iso-ne-market-rule-1
    authority_id: iso-ne
    organization_type: system-operator
    activity: wholesale-transactions
    status: approved-tariff-or-rule
    jurisdiction_scope: New England only
    supported_responsibility: >-
      ISO-NE's tariff sets rates, terms, and conditions for its services. Section III,
      Market Rule 1, governs the New England wholesale electricity markets. The page
      describes the tariff as created and authorized by FERC.
    explicit_limitations:
      - Only the tariff's index page was read, not the text of Market Rule 1.
      - Section dates listed on the page were not confirmed as effective dates, so none is recorded.
      - Other regions have their own tariffs; nothing here describes them.
    source_reference: iso-ne-tariff
    source_section: Tariff index page, Section III (Market Rule 1)
    source_version: Index page as retrieved; Section I listed as 10/07/2025 and Section IV.A as 01/01/2026
    published_date: null
    effective_date: null
    retrieved_at: 2026-10-11
    human_review_status: unreviewed
    related: [ferc-wholesale-sales]
  - id: ercot-wholesale-settlement
    authority_id: ercot
    organization_type: system-operator
    activity: wholesale-transactions
    status: official-guidance
    jurisdiction_scope: The ERCOT region of Texas (about 90% of Texas electric load, by ERCOT's description)
    supported_responsibility: >-
      ERCOT describes itself as scheduling power on the grid it manages and performing
      financial settlement for the competitive wholesale bulk-power market. It says it is
      subject to oversight by the Public Utility Commission of Texas and the Texas
      Legislature.
    explicit_limitations:
      - This is ERCOT's own description, not a statute or rule.
      - The page does not mention FERC or NERC; this record draws no conclusion about their roles in ERCOT.
      - The Public Utility Commission of Texas website returned an error, so its own description was not read.
    source_reference: ercot-about
    source_section: About ERCOT
    source_version: Page as retrieved (no date shown)
    published_date: null
    effective_date: null
    retrieved_at: 2026-10-11
    human_review_status: unreviewed

